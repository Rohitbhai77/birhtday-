<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Premlata 🎂</title>

<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 0;
        background-color: #100018;
        font-family: Arial, Helvetica, sans-serif;
    }
    table {
        border-spacing: 0;
        border-collapse: collapse;
    }
    img {
        border: 0;
        display: block;
        max-width: 100%;
    }
    .main-bg {
        background-color: #100018;
        background-image:
            radial-gradient(circle at top left, #3b075f 0%, transparent 35%),
            radial-gradient(circle at bottom right, #58002e 0%, transparent 35%);
    }
    .card {
        width: 100%;
        max-width: 560px;
        background-color: #1b0925;
        border: 1px solid #542064;
        border-radius: 24px;
        overflow: hidden;
    }
    .title {
        font-size: 32px;
        line-height: 1.25;
        font-weight: bold;
        color: #ffffff;
        text-align: center;
    }
    .subtitle {
        font-size: 17px;
        line-height: 1.6;
        color: #e9dff0;
        text-align: center;
    }
    .button {
        background-color: #ff2b9a;
        border-radius: 40px;
        display: inline-block;
        border: none;
        cursor: pointer;
        padding: 16px 32px;
        font-size: 17px;
        font-weight: bold;
        color: #ffffff;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(255, 43, 154, 0.4);
        transition: transform 0.2s ease, background 0.2s ease;
    }
    .button:hover {
        transform: scale(1.05);
        background-color: #e61c8a;
    }

    /* STEP 1: TYPING WISH TEXT CONTAINER */
    #wishContainer {
        display: none;
        padding: 10px 35px 15px;
    }
    .wish-content {
        font-size: 18px;
        line-height: 1.8;
        color: #ffffff;
        text-align: center;
    }
    .typewriter-cursor {
        display: inline-block;
        width: 3px;
        height: 1.1em;
        background-color: #ff2b9a;
        margin-left: 4px;
        vertical-align: middle;
        animation: blink 0.7s infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* STEP 2: CAKE SECTION (HIDDEN UNTIL TYPING COMPLETES) */
    #cakeBox {
        display: none;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.8s ease, transform 0.8s ease;
        flex-direction: column;
        align-items: center;
        margin: 15px auto 25px;
        cursor: pointer;
        user-select: none;
    }
    #cakeBox.show {
        display: flex;
        opacity: 1;
        transform: translateY(0);
    }

    .cake {
        position: relative;
        width: 190px;
        height: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
    }
    .candle {
        position: absolute;
        top: 0;
        width: 12px;
        height: 42px;
        background: repeating-linear-gradient(45deg, #ffffff, #ffffff 5px, #ff2b9a 5px, #ff2b9a 10px);
        border-radius: 4px;
        z-index: 5;
    }
    .flame {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 15px;
        height: 24px;
        background: radial-gradient(ellipse at bottom, #fff700 0%, #ff6600 65%, transparent 85%);
        border-radius: 50% 50% 35% 35%;
        box-shadow: 0 0 18px #ffcc00, 0 0 35px #ff6600;
        animation: flicker 0.5s infinite alternate ease-in-out;
    }
    @keyframes flicker {
        0% { transform: translateX(-50%) scale(1) rotate(-3deg); }
        100% { transform: translateX(-50%) scale(1.18) rotate(3deg); }
    }
    .flame.extinguished {
        display: none;
    }
    .smoke {
        display: none;
        position: absolute;
        top: -25px;
        left: 50%;
        width: 8px;
        height: 22px;
        background: rgba(255,255,255,0.45);
        border-radius: 50%;
        animation: smokeRise 1.2s forwards;
    }
    @keyframes smokeRise {
        0% { opacity: 0.9; transform: translate(-50%, 0) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -35px) scale(2.2); }
    }

    .layer-top {
        width: 140px;
        height: 42px;
        background: linear-gradient(135deg, #ff7eb3, #ff2b9a);
        border-radius: 14px 14px 6px 6px;
        border: 2px solid #ffb6c1;
        position: relative;
        z-index: 2;
    }
    .layer-bottom {
        width: 190px;
        height: 50px;
        background: linear-gradient(135deg, #6c1a7d, #3c0950);
        border-radius: 8px 8px 18px 18px;
        border: 2px solid #a84bb5;
        margin-top: -6px;
        position: relative;
        z-index: 1;
    }
    .cake.cut .layer-top {
        clip-path: polygon(0 0, 48% 0, 48% 100%, 0 100%);
    }
    .cake.cut::after {
        content: '🍰';
        position: absolute;
        right: 10px;
        top: 25px;
        font-size: 34px;
        animation: popSlice 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes popSlice {
        0% { transform: translateY(0) scale(0.4); opacity: 0; }
        100% { transform: translateY(-12px) scale(1.2); opacity: 1; }
    }

    .cake-instruction {
        color: #ff9ee2;
        font-size: 16px;
        margin-top: 14px;
        font-weight: bold;
        letter-spacing: 0.5px;
        animation: pulse 1.4s infinite;
        text-align: center;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.97); }
    }

    .footer {
        font-size: 12px;
        line-height: 1.5;
        color: #9f8da8;
        text-align: center;
        padding: 15px 25px 22px;
        border-top: 1px solid #38203f;
    }

    @media screen and (max-width: 600px) {
        .card { width: 94% !important; }
        .title { font-size: 26px !important; }
        #wishContainer { padding: 10px 20px 10px !important; }
        .wish-content { font-size: 16px !important; }
        .button { padding: 14px 26px !important; font-size: 16px !important; }
    }
</style>
</head>

<body>

<table width="100%" cellpadding="0" cellspacing="0" border="0" class="main-bg">
<tr>
<td align="center" style="padding:30px 10px;">

    <!-- MAIN CARD -->
    <table width="560" cellpadding="0" cellspacing="0" border="0" class="card">
        
        <!-- TOP DECORATION -->
        <tr>
            <td align="center" style="padding:25px 20px 10px; font-size:34px;">
                🎉 &nbsp; 🎂 &nbsp; 💖
            </td>
        </tr>

        <!-- TITLE -->
        <tr>
            <td class="title" style="padding:10px 25px 8px;">
                🎂 Happy Birthday, Premlata! 💖
            </td>
        </tr>

        <!-- SUBTITLE -->
        <tr>
            <td class="subtitle" style="padding:0 35px 22px;">
                Wishing you a beautiful day filled with happiness, smiles and wonderful memories. ✨
            </td>
        </tr>

        <!-- PROFILE PHOTO -->
        <tr>
            <td align="center" style="padding:5px 25px 25px;">
                <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                        <td style="padding:5px; background:#ff2b9a; border-radius:50%;">
                            <img
                                src="https://cdn.phototourl.com/member/2026-09-25-90f80318-5e9e-4195-bc1a-fe9762794cad.jpg"
                                width="190"
                                height="190"
                                alt="Premlata"
                                style="width:190px; height:190px; border-radius:50%; object-fit:cover; border:4px solid #ffffff;"
                            >
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- SURPRISE BUTTON -->
        <tr id="btnRow">
            <td align="center" style="padding:10px 25px 35px;">
                <button class="button" onclick="revealSurprise()">
                    🎁 Open Birthday Surprise
                </button>
            </td>
        </tr>

        <!-- STEP 1: TYPING WISH TEXT -->
        <tr>
            <td>
                <div id="wishContainer">
                    <div class="wish-content">
                        <span id="typedWish"></span><span class="typewriter-cursor" id="typeCursor"></span>
                    </div>
                </div>
            </td>
        </tr>

        <!-- STEP 2: CAKE APPEARS AFTER TYPING -->
        <tr>
            <td>
                <div id="cakeBox" onclick="cutCake()" title="Click to cut!">
                    <div class="cake" id="cakeElem">
                        <div class="candle">
                            <div class="flame" id="flameElem"></div>
                            <div class="smoke" id="smokeElem"></div>
                        </div>
                        <div class="layer-top"></div>
                        <div class="layer-bottom"></div>
                    </div>
                    <div class="cake-instruction" id="cakeNotice">
                        ✨ Candle jali hui hai! Cake par tap/click karke cut karo! 🔪🎂
                    </div>
                </div>
            </td>
        </tr>

        <!-- BOTTOM DECORATION -->
        <tr>
            <td align="center" style="padding:15px 20px 25px; font-size:25px;">
                ✨ 🎈 💕 🎈 ✨
            </td>
        </tr>

        <!-- FOOTER -->
        <tr>
            <td class="footer">
                Made with 💖 specially for Premlata
            </td>
        </tr>

    </table>

</td>
</tr>
</table>

<script>
    const birthdayMessage = 
        "<strong style='color:#ff69b4; font-size:21px;'>Dear Premlata,</strong><br><br>" +
        "Wishing you a very Happy Birthday! 🎉🎂<br><br>" +
        "May your life always be filled with happiness, success, love and beautiful moments. 🌸✨<br><br>" +
        "May every dream in your heart come true and may you keep smiling and shining every day. 💖<br><br>" +
        "<strong>Have a wonderful and memorable birthday! 🥳🎁💐</strong>";

    let cakeCutDone = false;

    function revealSurprise() {
        // Button hide karein
        document.getElementById('btnRow').style.display = 'none';

        // Pehle wish text container show karein aur typing shuru karein
        const wishContainer = document.getElementById('wishContainer');
        wishContainer.style.display = 'block';

        typeWriter(birthdayMessage, 'typedWish', 24, onTypingComplete);
    }

    function typeWriter(htmlText, targetElementId, speed, onDone) {
        const target = document.getElementById(targetElementId);
        let i = 0;
        let isTag = false;
        let output = "";

        function type() {
            if (i < htmlText.length) {
                let char = htmlText.charAt(i);

                if (char === '<') isTag = true;
                if (char === '>') {
                    isTag = false;
                    output += char;
                    i++;
                    target.innerHTML = output;
                    setTimeout(type, speed);
                    return;
                }

                output += char;
                target.innerHTML = output;
                i++;

                if (isTag) {
                    type();
                } else {
                    setTimeout(type, speed);
                }
            } else {
                document.getElementById('typeCursor').style.display = 'none';
                if (typeof onDone === 'function') {
                    onDone();
                }
            }
        }
        type();
    }

    // Jab typing poori ho jaye, tab Cake show hoga
    function onTypingComplete() {
        const cakeBox = document.getElementById('cakeBox');
        cakeBox.classList.add('show');
    }

    // Cake cut function
    function cutCake() {
        if (cakeCutDone) return;
        cakeCutDone = true;

        // Candle bujhna aur smoke nikalna
        document.getElementById('flameElem').classList.add('extinguished');
        document.getElementById('smokeElem').style.display = 'block';

        // Cake cut animation
        document.getElementById('cakeElem').classList.add('cut');
        document.getElementById('cakeNotice').innerHTML = "🎉 Yay! 	Happy Birthday Premlata! 🎂💖";
        document.getElementById('cakeNotice').style.color = "#ffffff";
    }
</script>

</body>
</html>
